## Configuration
name: SafeRing
options:
  bundleIdPrefix: com.safering
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "130"
    DEVELOPMENT_TEAM: "53DRV2V873"
    INFOPLIST_FILE: SafeRing/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: online.db1k.safering.ios
    PRODUCT_NAME: SafeRing

schemes:
  SafeRing:
    build:
      targets:
        SafeRing: [run, test, profile, analyze, archive]
        MessageFilterExtension: [run, archive]
    test:
      targets:
        - SafeRingUITests
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  SafeRing:
    type: application
    platform: iOS
    sources:
      - path: SafeRing
        excludes:
          - "Extension/CallDirectoryHandler.swift"
          - "Extension/SmsClassifierService.swift"
          - "Data/Repository/IsolationTest.swift"
    settings:
      base:
        INFOPLIST_FILE: SafeRing/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: online.db1k.safering.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: "NO"
        TARGETED_DEVICE_FAMILY: 1
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    info:
      path: SafeRing/Info.plist
    entitlements:
      path: SafeRing/SafeRing.entitlements
    dependencies:
      - sdk: CallKit.framework
      - sdk: CoreML.framework
      - sdk: BackgroundTasks.framework
      - sdk: MessageUI.framework
      - sdk: ContactsUI.framework
      - sdk: Contacts.framework
      - target: MessageFilterExtension
        embed: true
      - target: CallDirectoryHandler
        embed: true
      - target: LiveCallerIDLookupHandler
        embed: true

  CallDirectoryHandler:
    type: app-extension
    platform: iOS
    sources:
      - CallDirectoryHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.db1k.safering.ios.CallDirectoryHandler
        INFOPLIST_FILE: CallDirectoryHandler/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    dependencies:
      - sdk: CallKit.framework


  MessageFilterExtension:
    type: app-extension
    platform: iOS
    sources:
      - MessageFilterExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.db1k.safering.ios.MessageFilterExtension
        INFOPLIST_FILE: MessageFilterExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: MessageFilterExtension/MessageFilterExtension.entitlements
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CURRENT_PROJECT_VERSION: "130"
        MARKETING_VERSION: "1.0.0"
    dependencies:
      - sdk: IdentityLookup.framework

  LiveCallerIDLookupHandler:
    type: app-extension
    platform: iOS
    sources:
      - LiveCallerIDLookupHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.db1k.safering.ios.LiveCallerIDLookupHandler
        INFOPLIST_FILE: LiveCallerIDLookupHandler/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    dependencies:
      - sdk: CallKit.framework
      - sdk: BackgroundTasks.framework
      - target: SafeRing

  SafeRingWatch:
    type: application
    platform: watchOS
    sources:
      - SafeRingWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.db1k.safering.ios.watchkitapp
        INFOPLIST_FILE: SafeRingWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 4
        WATCHOS_DEPLOYMENT_TARGET: "9.0"
    dependencies:
      - target: SafeRingWatchExtension

  SafeRingWatchExtension:
    type: watchkit2-extension
    platform: watchOS
    sources:
      - WatchExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.db1k.safering.ios.watchkitapp.watchkitextension
        INFOPLIST_FILE: WatchExtension/Info.plist
        WATCHOS_DEPLOYMENT_TARGET: "9.0"
    dependencies:
      - sdk: WatchKit.framework
      - sdk: WatchConnectivity.framework

  SafeRingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SafeRingUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.db1k.safering.ios.uitests
        INFOPLIST_FILE: SafeRingUITests/Info.plist
        TEST_TARGET_NAME: SafeRing
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        DEFINES_MODULE: "NO"
        SWIFT_INSTALL_OBJC_HEADER: "NO"
        BUILD_LIBRARY_FOR_DISTRIBUTION: "NO"
    dependencies:
      - target: SafeRing
