# SafeRing — Android CI/CD
# Builds the signed APK and distributes to Firebase App Distribution
# (the Android equivalent of TestFlight).

name: Android Build & Firebase Distribution

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Upload to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret is empty"
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" | base64 --decode > /tmp/firebase-service-account.json
          echo "FIREBASE_SERVICE_ACCOUNT=/tmp/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Restore or generate keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/safering-keystore.jks
            echo "Using ANDROID_KEYSTORE_BASE64 secret"
          elif [ -f android/safering-keystore.jks ]; then
            echo "Using committed keystore"
          else
            keytool -genkey -v -keystore android/safering-keystore.jks \
              -alias safering \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass kailey99 \
              -keypass kailey99 \
              -dname "CN=SafeRing, OU=SafeRing, O=GMG, L=NYC, S=NY, C=US" \
              -noprompt
            echo "Generated ephemeral keystore (testers must uninstall previous builds)"
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: safering-keystore.jks
          KEYSTORE_PASSWORD: kailey99
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Distribute to Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT: /tmp/firebase-service-account.json
          FIREBASE_RELEASE_NOTES: "1.0.17: notification after we silence an unknown call (Get my person). Share a text from Messages into Check. Home shows whether SafeRing is actually the Caller ID & spam app."
        run: |
          cd android
          ./gradlew appDistributionUploadRelease --no-daemon --stacktrace
